<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="78%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#e8a33d" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e8a33d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#232a37" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Ground -->
  <rect width="1200" height="630" fill="#0b0e14"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Seal border -->
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#a66f1f" stroke-width="2" opacity="0.5"/>

  <!-- Logo mark: three signed/verified nodes, recolored to seal amber -->
  <g transform="translate(120,150)">
    <line x1="0" y1="0" x2="66" y2="20" stroke="#e8a33d" stroke-width="3" opacity="0.7"/>
    <line x1="0" y1="0" x2="22" y2="70" stroke="#e8a33d" stroke-width="3" opacity="0.7"/>
    <line x1="22" y1="70" x2="66" y2="20" stroke="#e8a33d" stroke-width="3" opacity="0.7"/>
    <circle cx="0" cy="0" r="11" fill="#e8a33d"/>
    <circle cx="66" cy="20" r="11" fill="#e8a33d"/>
    <circle cx="22" cy="70" r="11" fill="#e8a33d"/>
  </g>

  <!-- Eyebrow -->
  <text x="120" y="290" font-family="JetBrains Mono, ui-monospace, Menlo, monospace"
        font-size="22" letter-spacing="3" fill="#7c8798">CKS · CANONICAL KNOWLEDGE STRUCTURE</text>

  <!-- Title -->
  <text x="118" y="365" font-family="Manrope, system-ui, sans-serif" font-weight="800"
        font-size="64" letter-spacing="-0.01em" fill="#f4f6fa">Documentation</text>

  <!-- Tagline -->
  <text x="120" y="425" font-family="Manrope, system-ui, sans-serif" font-weight="500"
        font-size="28" fill="#a9b2c1">A verifiable knowledge backbone for LLMs</text>

  <!-- Bottom rule + footer -->
  <line x1="120" y1="500" x2="1080" y2="500" stroke="#232a37" stroke-width="1"/>
  <text x="120" y="545" font-family="JetBrains Mono, ui-monospace, Menlo, monospace"
        font-size="20" fill="#7c8798">deus-corp.github.io/cks-website</text>
  <text x="1080" y="545" font-family="JetBrains Mono, ui-monospace, Menlo, monospace"
        font-size="20" fill="#a66f1f" text-anchor="end">SIGNED · TRACEABLE · AUDITABLE</text>
</svg>
