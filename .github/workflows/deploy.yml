name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cks-website
        uses: actions/checkout@v4

      - name: Checkout cks-studio
        uses: actions/checkout@v4
        with:
          repository: Deus-corp/cks-studio
          path: cks-studio

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install website dependencies
        run: npm ci

      - name: Build cks-studio demo
        working-directory: cks-studio
        run: |
          npm ci
          npx vite build --base=/cks-website/demo/

      - name: Copy demo into public/
        run: |
          mkdir -p public/demo
          cp -r cks-studio/dist/* public/demo/
          # Remove files that conflict with Starlight or are not needed in the demo
          rm -f public/demo/index.html public/demo/manifest.webmanifest

      - name: Build website
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist